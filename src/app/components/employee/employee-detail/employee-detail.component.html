<div class="detail-page">
  <h2>Employee Detail</h2>

  <div *ngIf="employee" class="detail-card">
    <div class="detail-row"><span class="label">ID</span><span>{{ employee.id }}</span></div>
    <div class="detail-row"><span class="label">Name</span><span>{{ employee.name }}</span></div>
    <div class="detail-row"><span class="label">Email</span><span>{{ employee.email }}</span></div>
    <div class="detail-row"><span class="label">Position</span><span>{{ employee.position }}</span></div>
    <div class="detail-row"><span class="label">Salary</span><span>${{ employee.salary }}</span></div>
    <div class="detail-row">
      <span class="label">Status</span>
      <span class="badge" [class.badge-active]="employee.isActive" [class.badge-inactive]="!employee.isActive">
        {{ employee.isActive ? 'Active' : 'Deactivated' }}
      </span>
    </div>

    <div class="detail-actions">
      <button (click)="goToEdit(employee.id!)" class="btn btn-edit">Edit</button>
      <button (click)="goBack()" class="btn btn-back">Back to List</button>
    </div>
  </div>

  <div *ngIf="!employee" class="loading">Loading...</div>
</div>
