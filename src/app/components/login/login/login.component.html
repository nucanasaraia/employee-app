<div class="login-page">
  <div class="login-card">
    <img src="assets/images/logoo.png" alt="Logo" class="login-logo" />

    <!-- Tabs -->
    <div class="tabs">
      <button (click)="activeTab = 'login'"
              [class.tab-active]="activeTab === 'login'"
              class="tab-btn">
        Sign In
      </button>
      <button (click)="activeTab = 'register'"
              [class.tab-active]="activeTab === 'register'"
              class="tab-btn">
        Sign Up
      </button>
    </div>

    <!-- Login Form -->
    <div *ngIf="activeTab === 'login'">
      <div class="field">
        <label>Username</label>
        <input [(ngModel)]="loginUsername" placeholder="Enter username" class="input" />
      </div>
      <div class="field">
        <label>Password</label>
        <input [(ngModel)]="loginPassword" type="password" placeholder="Enter password" class="input" />
      </div>
      <small *ngIf="loginError" class="error">{{ loginError }}</small>
      <button (click)="login()" class="btn-login">Sign In</button>
    </div>

    <!-- Register Form -->
    <div *ngIf="activeTab === 'register'">
      <div class="field">
        <label>Username</label>
        <input [(ngModel)]="regUsername" placeholder="Choose username" class="input" />
      </div>
      <div class="field">
        <label>Password</label>
        <input [(ngModel)]="regPassword" type="password" placeholder="Choose password" class="input" />
      </div>
      <div class="field">
        <label>Confirm Password</label>
        <input [(ngModel)]="regConfirm" type="password" placeholder="Repeat password" class="input" />
      </div>
      <div class="field">
        <label>Role</label>
        <select [(ngModel)]="selectedRoleId" class="input">
          <option *ngFor="let role of roles" [value]="role.id">{{ role.name }}</option>
        </select>
      </div>
      <small *ngIf="regError"   class="error">{{ regError }}</small>
      <small *ngIf="regSuccess" class="success">{{ regSuccess }}</small>
      <button (click)="register()" class="btn-login">Sign Up</button>
    </div>
  </div>
</div>
