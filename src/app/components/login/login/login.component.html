<div class="login-page">
  <div class="login-card">
    <img src="assets/images/logoo.png" alt="Logo" class="login-logo" />
    <h2>Sign In</h2>

    <div class="field">
      <label>Username</label>
      <input [(ngModel)]="username" placeholder="Enter username" class="input" />
    </div>

    <div class="field">
      <label>Password</label>
      <input [(ngModel)]="password" type="password" placeholder="Enter password" class="input" />
    </div>

    <small *ngIf="error" class="error">{{ error }}</small>

    <button (click)="login()" class="btn-login">Sign In</button>
  </div>
</div>
