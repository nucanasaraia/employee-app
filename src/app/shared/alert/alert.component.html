<div class="toast-container">
  <div *ngFor="let t of alerts"
       class="toast"
       [class.toast-success]="t.type === 'success'"
       [class.toast-error]="t.type === 'error'"
       [class.toast-warning]="t.type === 'warning'"
       [class.toast-info]="t.type === 'info'">

    <span class="toast-icon">
      <span *ngIf="t.type === 'success'">✓</span>
      <span *ngIf="t.type === 'error'">✕</span>    
      <span *ngIf="t.type === 'warning'">⚠</span>
      <span *ngIf="t.type === 'info'">ℹ</span>
    </span>

    <span class="toast-message">{{ t.message }}</span>

    <button (click)="close(t.id)" class="toast-close">✕</button>
  </div>
</div>
